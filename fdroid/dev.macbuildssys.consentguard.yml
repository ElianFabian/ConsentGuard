# Upstream ConsentGuard F-Droid metadata template (kept for reference).
# CookieRejecter uses the application ID dev.cookierejecter and is not represented by this file.
#
# This file is NOT read by our own build. F-Droid metadata lives in
# their own fdroiddata repo, not in the app's repo. When ready to submit:
#   1. Push this project to a public GitHub repo (replace SourceCode below).
#   2. Tag the release commit to match versionName in app/build.gradle.kts,
#      e.g. `git tag v0.0.2 && git push --tags`.
#   3. Fork https://gitlab.com/fdroid/fdroiddata, add this file there as
#      metadata/dev.macbuildssys.consentguard.yml, open a merge request.
# See https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/

Categories:
  - Security

License: MIT

AuthorName: macbuildssys
SourceCode: https://github.com/macbuildssys/ConsentGuard
IssueTracker: https://github.com/macbuildssys/ConsentGuard/issues

AutoName: ConsentGuard

RepoType: git
Repo: https://github.com/macbuildssys/ConsentGuard.git

Builds:
  - versionName: '0.0.1'
    versionCode: 1
    commit: v0.0.1
    subdir: app
    gradle:
      - yes

  - versionName: '0.0.2'
    versionCode: 2
    commit: v0.0.2
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '0.0.2'
CurrentVersionCode: 2
